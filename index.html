<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LESO LIFE</title>
<meta name="description" content="生活费、饮食、睡眠和步数记录，每天五星结算。数据只存在你自己的浏览器里。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LESO LIFE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#edf1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+SC:wght@400;500;700&display=swap"></noscript>
<style>
/* Layout: one phone-width column, a dark "result screen" panel for the daily settlement, fixed bottom tab bar. */
:root {
  --bg: #edf1ee;
  --surface: #ffffff;
  --surface-2: #e2e8e4;
  --fg: #15211c;
  --muted: #536259;
  --line: #d2dad5;
  --accent: #1b7656;
  --accent-ink: #ffffff;
  --accent-soft: #d5ebe1;
  --star: #b87600;
  --hero-star: #f0b232;
  --star-line: #92a39b;
  --good: #1b7656;
  --warn: #a8640a;
  --bad: #bf3f2b;
  --good-ink: #135a41;
  --warn-ink: #7a4700;
  --bad-ink: #9b2c1c;
  --hero-bg: #15211c;
  --hero-fg: #eef4f0;
  --hero-muted: #a3b5ac;
  --hero-star-line: #7f9189;
  --font-display: "Bricolage Grotesque", "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
  --font-body: "Noto Sans SC", -apple-system, "PingFang SC", "Apple SD Gothic Neo", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1311; --surface: #151d1a; --surface-2: #1e2824; --fg: #e5eee9; --muted: #98a9a1;
    --line: #29352f; --accent: #48c393; --accent-ink: #05130d; --accent-soft: #163a2c;
    --star: #f3bd42; --hero-star: #f3bd42; --star-line: #7d8f87; --good: #48c393; --warn: #e6a23a; --bad: #ef7966;
    --good-ink: #5fd3a5; --warn-ink: #f0b24f; --bad-ink: #f48b79;
    --hero-bg: #1c2622; --hero-fg: #eef4f0; --hero-muted: #9aada4; --hero-star-line: #6d7f77;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1311; --surface: #151d1a; --surface-2: #1e2824; --fg: #e5eee9; --muted: #98a9a1;
  --line: #29352f; --accent: #48c393; --accent-ink: #05130d; --accent-soft: #163a2c;
  --star: #f3bd42; --hero-star: #f3bd42; --star-line: #7d8f87; --good: #48c393; --warn: #e6a23a; --bad: #ef7966;
  --good-ink: #5fd3a5; --warn-ink: #f0b24f; --bad-ink: #f48b79;
  --hero-bg: #1c2622; --hero-fg: #eef4f0; --hero-muted: #9aada4; --hero-star-line: #6d7f77;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; scroll-padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-inline: 16px; padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 480px; margin: 0 auto; display: grid; gap: 14px; min-width: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.money-text { white-space: nowrap; }

/* Top bar */
.topbar { display: flex; align-items: baseline; justify-content: space-between; padding-block: 14px 2px; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: 0.04em; }
.brand small { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.08em; margin-left: 6px; }
.topdate { color: var(--muted); font-size: 13px; }

/* Banners */
.banner { border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; font-size: 14px; background: var(--accent-soft); overflow-wrap: anywhere; }
.banner.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }
.banner .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Cards */
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; }
.card h2 .hint { font-size: 12px; font-weight: 400; color: var(--muted); }
.label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.wrapany { overflow-wrap: anywhere; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: clamp(15px, 4.6vw, 18px); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.divider { height: 1px; background: var(--line); }
@media (max-width: 359px) {
  .grid2.stack-narrow, .grid2.stats { grid-template-columns: minmax(0, 1fr); }
}

/* Home hero */
.money { display: grid; gap: 4px; min-width: 0; }
.money .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 10vw, 46px); line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today-row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.today-row b { font-size: clamp(18px, 6vw, 22px); }
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.over > i { background: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.good { background: color-mix(in srgb, var(--good) 12%, transparent); color: var(--good-ink); }
.chip.warn { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn-ink); }
.chip.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad-ink); }
.chip.none { background: var(--surface-2); color: var(--muted); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.text-bad { color: var(--bad-ink); }

/* Stars: earned = filled, not earned = outline, not counted = dashed outline */
.stars { display: flex; gap: 4px; }
.star { width: 22px; height: 22px; fill: none; stroke: var(--star-line); stroke-width: 1.6; stroke-linejoin: round; flex: none; }
.star.on { fill: var(--star); stroke: var(--star); }
.star.skip { stroke-dasharray: 2.5 2.5; opacity: 0.8; }
.dimrow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; text-align: center; }
.dimrow .d { display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--muted); }

/* Buttons */
.btn { border: 0; border-radius: 12px; padding: 11px 14px; background: var(--surface-2); font-weight: 500; font-size: 15px; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); color: var(--bad-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow > .btn { flex: 1 1 auto; }
.linkbtn { background: none; border: 0; padding: 8px 4px; margin: -8px -4px; min-height: 40px; color: var(--accent); font-weight: 500; font-size: 14px; }
.linkbtn.danger { color: var(--bad-ink); }
.linkbtn:disabled { color: var(--muted); }

/* Forms */
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); }
.grid2 > .field, .grid3 > .field { align-content: end; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; min-width: 0; font-size: 16px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); min-height: 44px;
}
input[type="date"] { -webkit-appearance: none; appearance: none; padding-inline: 8px; }
textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
textarea.code { font-family: ui-monospace, Menlo, monospace; font-size: 16px; line-height: 1.4; }
.err { color: var(--bad-ink); font-size: 13px; }
.note { color: var(--warn-ink); font-size: 13px; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 8px 2px; font-size: 14px; min-height: 40px; min-width: 0; }
.seg button.on { background: var(--surface); font-weight: 700; box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.check.disabled { color: var(--muted); }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cats button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 14px; min-height: 40px; }
.cats button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.meal { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; }
.meal label { display: flex; align-items: center; gap: 8px; min-width: 72px; min-height: 44px; font-size: 14px; }
.meal input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
.filebtn { position: relative; display: grid; place-items: center; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.vh:focus-visible + .filebtn, .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
details > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 6px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); flex: none; margin-right: 2px; }
details[open] > summary::before { transform: rotate(45deg); }

/* Lists */
.list { display: grid; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding-block: 10px; border-top: 1px solid var(--line); align-items: center; }
.item:first-child { border-top: 0; }
.item .t { min-width: 0; overflow-wrap: anywhere; }
.item .amt { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.item .acts { grid-column: 1 / -1; display: flex; gap: 22px; padding-top: 2px; }
.empty { color: var(--muted); font-size: 14px; padding-block: 6px; }

/* Date nav */
.datenav { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; }
.datenav .mid { text-align: center; display: grid; gap: 0; justify-items: center; }
.datenav .mid b { font-size: 16px; }
.datenav .mid .linkbtn { font-size: 13px; min-height: 40px; margin: -8px 0; padding: 8px 8px; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--surface); display: grid; place-items: center; }
.iconbtn:disabled { opacity: 0.35; cursor: default; }
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Settlement hero */
.result { background: var(--hero-bg); color: var(--hero-fg); border-radius: 18px; padding: 20px 18px; display: grid; gap: 14px; min-width: 0; }
.result .eyebrow { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.14em; font-size: 12px; color: var(--hero-muted); text-transform: uppercase; }
.result .rstars { display: flex; gap: 6px; }
.result .rstars .star { width: 40px; height: 40px; stroke: var(--hero-star-line); stroke-width: 1.3; }
.result .rstars .star.on { fill: var(--hero-star); stroke: var(--hero-star); }
.result .score { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; }
.result .score small { font-size: 15px; font-weight: 500; color: var(--hero-muted); margin-left: 6px; }
.result .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; border-top: 1px solid color-mix(in srgb, var(--hero-fg) 14%, transparent); padding-top: 12px; }
.result .cols .label { color: var(--hero-muted); }
.result .cols .v { font-family: var(--font-display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dim { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 2px 10px; padding-block: 12px; border-top: 1px solid var(--line); }
.dim:first-of-type { border-top: 0; }
.dim .star { grid-row: span 3; width: 26px; height: 26px; }
.dim .nm { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; flex-wrap: wrap; }
.dim .small, .dim .rule, .dim .tip { overflow-wrap: anywhere; min-width: 0; }
.dim .rule { font-size: 12px; color: var(--muted); }
.dim .tip { font-size: 13px; color: var(--warn-ink); grid-column: 2; }
.summary p { margin: 0 0 8px; overflow-wrap: anywhere; }
.summary p:last-child { margin: 0; }
.diarybox { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; background: var(--surface-2); border-radius: 10px; padding: 12px; }

/* Charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .gridline { stroke: var(--line); stroke-width: 1; }
.chart .ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .barm { fill: var(--accent); }
.chart .barm.over { fill: var(--bad); }
.chart .barm.sel { opacity: 0.55; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:focus-visible { outline: none; fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: var(--accent); stroke-width: 2; }
.readout { font-size: 13px; min-height: 20px; color: var(--fg); }
.hbars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; font-size: 13px; }
.hbars .track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.hbars .track i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.hbars .v { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--accent); margin-right: 5px; vertical-align: -1px; }
.legend i.over { background: var(--bad); }
.legend i.ref { background: none; border-top: 2px dashed var(--muted); height: 0; width: 14px; vertical-align: 3px; border-radius: 0; }

/* History rows */
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding-block: 10px; border-top: 1px solid var(--line); }
.hrow:first-child { border-top: 0; }
.hrow .stars .star { width: 15px; height: 15px; }
.hrow .acts { grid-column: 1 / -1; display: flex; gap: 22px; padding-top: 2px; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabbar .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--muted); min-height: 52px; }
.tabbar button svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button.on { color: var(--accent); font-weight: 700; }

/* Sheet + toast */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.45); z-index: 30; display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 88vh; overflow-y: auto; }
.sheet h3 { margin: 0; font-size: 17px; }
.toast { pointer-events: none; position: fixed; left: 16px; right: 16px; margin: 0 auto; width: fit-content; max-width: 448px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--fg); color: var(--bg); border-radius: 16px; padding: 8px 16px; font-size: 14px; display: flex; gap: 12px; align-items: center; }
.toast span { overflow-wrap: anywhere; min-width: 0; }
.toast.top { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); }
.toast button { pointer-events: auto; flex: none; white-space: nowrap; min-height: 36px; padding: 0 8px; background: none; border: 0; color: var(--bg); font-weight: 700; text-decoration: underline; }
.savedot { font-size: 12px; color: var(--muted); font-weight: 400; }
.anchor { scroll-margin-top: 12px; }

@media (prefers-reduced-motion: no-preference) {
  .result .rstars .star.on { animation: pop 0.45s ease-out both; }
  .result .rstars .star.on:nth-child(2) { animation-delay: 0.08s; }
  .result .rstars .star.on:nth-child(3) { animation-delay: 0.16s; }
  .result .rstars .star.on:nth-child(4) { animation-delay: 0.24s; }
  .result .rstars .star.on:nth-child(5) { animation-delay: 0.32s; }
  @keyframes pop { from { transform: scale(0.6); } 60% { transform: scale(1.12); } to { transform: scale(1); } }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="topbar">
    <div class="brand">LESO LIFE<small>V0.1</small></div>
    <div class="topdate" id="topdate"></div>
  </header>
  <div id="banners" class="wrap"></div>
  <main id="view" class="wrap"></main>
</div>

<nav class="tabbar" aria-label="主导航">
  <div class="in">
    <button type="button" data-act="tab" data-tab="home" id="tab-home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>首页</button>
    <button type="button" data-act="tab" data-tab="record" id="tab-record"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg>记录</button>
    <button type="button" data-act="tab" data-tab="settle" id="tab-settle"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.5 5.2 5.7.7-4.2 4 1.1 5.6L12 16.3 6.9 19l1.1-5.6-4.2-4 5.7-.7z"/></svg>结算</button>
    <button type="button" data-act="tab" data-tab="history" id="tab-history"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>历史</button>
    <button type="button" data-act="tab" data-tab="settings" id="tab-settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.2-3.8 4-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/></svg>设置</button>
  </div>
</nav>

<div id="sheetroot"></div>
<div id="toastroot"></div>

<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var STORE_KEY = 'leso-life:data';
  var DRAFT_KEY = 'leso-life:draft';
  var APP_ID = 'leso-life';
  var DATA_VERSION = 1;

    F.onTrack = F.poolAfter >= -0.5 && F.avg * F.daysLeftAfter <= F.poolAfter + 0.5;
    F.shortDays = F.onTrack ? 0 : Math.max(0, Math.ceil(F.daysLeftAfter - F.lasts));
    F.overBy = Math.max(0, -F.poolAfter);
    return F;
  }

  // ---------- star rules ----------
  function evaluate(X, alloc) {
    var s = state.settings, R = s.rules, d = getDay(X), F = finance(X, alloc);
    var out = { X: X, F: F, d: d, dims: {}, stars: 0, counted: 0, recorded: hasRecord(X) };
    function put(key, status, actual, rule, tip) { out.dims[key] = { status: status, actual: actual, rule: rule, tip: tip || '' }; }

    // budget
    var bRule = R.budget.mode === 'daily'
      ? '当天花费（分摊后）不超过当天额度'
      : '按近 ' + R.budget.paceDays + ' 天的平均花费，剩下的预算能撑到目标日（' + fmtDate(s.endDate) + '）';
    if (!isSetUp()) put('budget', 'skip', '还没设置资金，这一项不计分', bRule);
    else if (!F.inPeriod) put('budget', 'skip', '不在预算周期内，这一项不计分', bRule);
    else if (!out.recorded) put('budget', 'none', '未记录', bRule);
    else {
      var noneLeft = F.daysLeftAfter > 0 && F.poolAfter <= 0.5;
      var pass = R.budget.mode === 'daily' ? (!F.exhausted && F.daySpent <= F.allowance + 0.5) : (F.onTrack && !noneLeft);
      var act = '当天 ' + fmtW(F.daySpent) + ' / 额度 ' + fmtW(F.allowance);
      if (R.budget.mode !== 'daily') act += '；近 ' + F.paceCount + ' 天平均 ' + fmtW(F.avg) + '/天';
      var tip = '';
      if (!pass) {
        if (F.poolAfter <= 0.5) tip = '预算已经用完' + (F.overBy >= 1 ? '，超出 ' + fmtW(F.overBy) : '') + '。需要补充资金，或者减少固定支出、期末保留金额。';
        else if (F.tomorrow != null) tip = '之后每天控制在 ' + fmtW(F.tomorrow) + ' 以内，就能回到目标线。';
        else tip = '这是预算周期的最后一天，超出了 ' + fmtW(F.daySpent - F.allowance) + '。';
      }
      put('budget', pass ? 'pass' : 'fail', act, bRule, tip);
    }

    // food
    var fr = R.food, fbOn = fr.useFoodBudget && s.foodDaily;
    var fRule = '至少吃 ' + fr.minMeals + ' 餐，并满足 ' + fr.healthRequired + ' 项健康饮食' + (fbOn ? '，饮食花费不超过 ' + fmtW(s.foodDaily) : '');
    var meals = d ? MEALS.filter(function (m) { return mealEaten(d.meals[m.id]); }).length : 0;
    var checks = d ? CHECKS.filter(function (c) { return d.checks[c.id]; }).length : 0;
    if (!d || (meals === 0 && checks === 0)) put('food', 'none', '未记录', fRule);
    else {
      var okMeals = meals >= fr.minMeals, okChecks = checks >= fr.healthRequired;
      var okBudget = !fbOn || F.dayFood <= s.foodDaily + 0.5;
      var tips = [];
      if (!okMeals) tips.push('至少好好吃 ' + fr.minMeals + ' 餐，省钱不要省饭。');
      if (!okChecks) tips.push('加一份蔬菜或水果，少喝含糖饮料。');
      if (!okBudget) tips.push('饮食花费超了，可以多自己做饭。');
      put('food', okMeals && okChecks && okBudget ? 'pass' : 'fail', meals + ' 餐，健康项 ' + checks + '/' + CHECKS.length + (s.foodDaily ? '，饮食花费 ' + fmtW(F.dayFood) : ''), fRule, tips.join(''));
    }

    // sleep
    var sr = R.sleep, badRange = sr.minHours > sr.maxHours;
    var sRule = '睡眠 ' + fmtN(sr.minHours, 1) + '–' + fmtN(sr.maxHours, 1) + ' 小时' + (badRange ? '（最少大于最多，请在设置里修改）' : '');
    if (!d || d.sleep == null) put('sleep', 'none', '未记录', sRule);
    else {
      var okS = d.sleep >= sr.minHours && d.sleep <= sr.maxHours;
      put('sleep', okS ? 'pass' : 'fail', '睡了 ' + fmtN(d.sleep, 1) + ' 小时', sRule,
        okS ? '' : (d.sleep < sr.minHours ? '还差 ' + fmtN(sr.minHours - d.sleep, 1) + ' 小时，今晚早点睡。' : '睡得偏多，注意作息规律。'));
    }

    // move
    var mr = R.move;
    var mRule = '步数 ≥ ' + fmtN(mr.minSteps) + '，或运动 ≥ ' + fmtN(mr.altMinutes) + ' 分钟';
    if (!d || (d.steps == null && d.exMin == null)) put('move', 'none', '未记录', mRule);
    else {
      var okM = (d.steps != null && d.steps >= mr.minSteps) || (d.exMin != null && d.exMin >= mr.altMinutes);
      var mAct = (d.steps != null ? fmtN(d.steps) + ' 步' : '') + (d.exMin != null ? (d.steps != null ? '，' : '') + '运动 ' + fmtN(d.exMin) + ' 分钟' : '');
      var mTip = '';
      if (!okM) {
        var needSteps = Math.max(0, mr.minSteps - (d.steps || 0)), needMin = Math.max(0, mr.altMinutes - (d.exMin || 0));
        mTip = d.steps != null ? '再多走 ' + fmtN(needSteps) + ' 步就达标，比如提前一站下车。' : '再运动 ' + fmtN(needMin) + ' 分钟就达标，或者多走走路。';
      }
      put('move', okM ? 'pass' : 'fail', mAct, mRule, mTip);
    }

    // body
    var bRule2 = '身体感受 ≥ ' + BODY[R.body.minScore - 1] + '（勾选“特殊情况”则这一项不计分）';
    if (d && d.bodySkip) put('body', 'skip', '特殊情况，不计分' + (d.bodyNote ? '：' + d.bodyNote : ''), bRule2);
    else if (!d || d.body == null) put('body', 'none', '未记录', bRule2);
    else {
      var okB = d.body >= R.body.minScore;
      put('body', okB ? 'pass' : 'fail', BODY[d.body - 1] + (d.bodyNote ? '：' + d.bodyNote : ''), bRule2, okB ? '' : '身体状态不太好，安排轻松一点，早点休息。');
    }

    DIMS.forEach(function (m) {
      var st = out.dims[m.key].status;
      if (st !== 'skip') out.counted++;
      if (st === 'pass') out.stars++;
    });
    return out;
  }

  function streak(X) {

      '<div class="note" id="health-note" hidden></div></section>';

      '<div class="seg" role="group" aria-label="身体感受">' + BODY.map(function (b, i) { return '<button type="button" data-act="body" data-v="' + (i + 1) + '" class="' + (d.body === i + 1 ? 'on' : '') + '" aria-pressed="' + (d.body === i + 1) + '">' + b + '</button>'; }).join('') + '</div>' +

  function recDateShown() { var f = document.getElementById('rec-form'); return f ? f.getAttribute('data-date') : (ui.recDate || todayKey()); }

  // ---------- SETTLE ----------

  function summaryHtml(ev) {
    var F = ev.F, s = state.settings, D = ev.dims, p = [];
    var isToday = ev.X === todayKey(), dayWord = isToday ? '今天' : '这天';
    if (isSetUp() && F.inPeriod) {
      var t = dayWord + '花了 <b class="money-text">' + fmtW(F.daySpent) + '</b>（分摊后）';
      if (F.exhausted) t += '，但预算在这之前已经用完了' + (-F.poolBefore >= 1 ? '（超出 ' + fmtW(-F.poolBefore) + '）' : '') + '。';
      else t += '，当天额度是 ' + fmtW(F.allowance) + '，' + (F.daySpent > F.allowance + 0.5 ? '超出 ' + fmtW(F.daySpent - F.allowance) + '。' : '还剩 ' + fmtW(F.allowance - F.daySpent) + '。');
      p.push(t);
      if (F.poolAfter <= 0.5 && F.daysLeftAfter > 0 && F.poolAfter >= -0.5) {
        p.push('到' + dayWord + '为止，可支配预算正好用完，之后每天的额度是 ₩0。需要补充资金，或者在设置里减少固定支出、期末保留金额。');
      } else if (F.poolAfter < -0.5) {
        p.push('到' + dayWord + '为止，花费已经比可支配预算多 <b class="money-text">' + fmtW(F.overBy) + '</b>。需要补充资金，或者在设置里减少固定支出、期末保留金额。');
      } else if (F.avg > 0) {
        if (F.onTrack) p.push('按近 ' + F.paceCount + ' 天平均每天 ' + fmtW(F.avg) + ' 的速度，剩下的预算可以撑到目标日 ' + fmtDate(s.endDate) + '。');
        else p.push('按近 ' + F.paceCount + ' 天平均每天 ' + fmtW(F.avg) + ' 的速度，钱会比目标日早大约 <b>' + F.shortDays + ' 天</b>用完。');
      }
      if (F.tomorrow != null && F.tomorrow >= 1) {
        p.push((F.daySpent > F.allowance + 0.5 ? '超出的部分已经平均摊到之后的每一天，' : '没花完的部分会留给之后的日子，') + '从次日起每天额度是 <b class="money-text">' + fmtW(F.tomorrow) + '</b>。');
      } else if (F.tomorrow == null) {
        p.push('这是预算周期的最后一天。');
      }
    } else if (!isSetUp()) {
      p.push('还没有设置资金，预算这一项暂时不计分。');
    } else {
      p.push('这天不在预算周期（' + fmtDate(s.startDate) + ' 到 ' + fmtDate(s.endDate) + '）内，预算不计分。');
    }
    var good = [], bad = [], none = [];
    DIMS.forEach(function (m) { var st = D[m.key].status; if (st === 'pass') good.push(m.name); else if (st === 'fail') bad.push(m.name); else if (st === 'none') none.push(m.name); });
    if (good.length) p.push('达标：' + good.join('、') + '。');
    if (bad.length) p.push('未达标：' + bad.join('、') + '。');
    if (none.length) p.push('还没记录：' + none.join('、') + '。');
    var tip = '';
    for (var i = 0; i < DIMS.length; i++) { var x = D[DIMS[i].key]; if (x.status === 'fail' && x.tip) { tip = x.tip; break; } }
    if (tip) p.push('<b>接下来可以先做到：</b>' + esc(tip));
    else if (!bad.length && !none.length && good.length) p.push('<b>' + dayWord + '计分的每一项都达标了。</b>');
    else if (!bad.length && none.length && good.length) p.push('已经记录的项目都达标了，把剩下的也记上吧。');
    return p.map(function (x) { return '<p>' + x + '</p>'; }).join('');
  }

  // ---------- HISTORY ----------
  function viewHistory() {
    var T = todayKey(), s = state.settings, alloc = buildAlloc();
    var keys = Object.keys(state.days).filter(hasRecord).sort().reverse();
    var range = ui.histRange;
    var h = '<div class="seg" role="group" aria-label="统计范围">' + [[7, '近 7 天'], [30, '近 30 天'], [0, '整个周期']].map(function (r) {
      return '<button type="button" data-act="hist-range" data-v="' + r[0] + '" class="' + (range === r[0] ? 'on' : '') + '" aria-pressed="' + (range === r[0]) + '">' + r[1] + '</button>';
    }).join('') + '</div>';

    if (range === 0 && T < s.startDate) {
      h += '<section class="card"><div class="empty">预算周期从 ' + fmtDate(s.startDate) + ' 开始。到那天以后，这里会显示整个周期的统计。</div></section>';
      return h + recordList(keys, alloc);
    }
    var from, to;
    if (range === 0) { to = T < s.endDate ? T : s.endDate; from = s.startDate; if (from > to) from = to; }
    else { to = T; from = addDays(T, -(range - 1)); }
    var n = diffDays(to, from) + 1;
    var days = []; for (var i = 0; i < n; i++) days.push(addDays(from, i));
    var spent = 0, paid = 0, food = 0, cats = {}, recDays = 0, starSum = 0, starCnt = 0, sl = [], st = [];
    days.forEach(function (k) {
      var a = alloc[k]; if (a) { spent += a.total; food += a.food; Object.keys(a.cats).forEach(function (c) { cats[c] = (cats[c] || 0) + a.cats[c]; }); }
      paid += dayActual(k);
      if (hasRecord(k)) {
        recDays++;
        var ev = evaluate(k, alloc); starSum += ev.stars; starCnt += ev.counted;
        var d = state.days[k]; if (d.sleep != null) sl.push(d.sleep); if (d.steps != null) st.push(d.steps);
      }
    });
    function avg(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }

    h += '<section class="card"><h2><span>统计</span><span class="hint">' + fmtShort(from) + ' – ' + fmtShort(to) + '，共 ' + n + ' 天</span></h2><div class="grid2 stats">' +
      '<div class="stat"><span class="label">花费（分摊后）</span><span class="v">' + fmtW(spent) + '</span></div>' +
      '<div class="stat"><span class="label">日均花费</span><span class="v">' + fmtW(spent / n) + '</span></div>' +
      '<div class="stat"><span class="label">实际付款</span><span class="v">' + fmtW(paid) + '</span></div>' +
      '<div class="stat"><span class="label">饮食花费</span><span class="v">' + fmtW(food) + '</span></div>' +
      '<div class="stat"><span class="label">记录天数</span><span class="v">' + recDays + ' / ' + n + '</span></div>' +
      '<div class="stat"><span class="label">星级达成率</span><span class="v">' + (starCnt ? Math.round(starSum / starCnt * 100) + '%' : '—') + '</span></div>' +
      '<div class="stat"><span class="label">平均睡眠</span><span class="v">' + (avg(sl) == null ? '—' : fmtN(avg(sl), 1) + ' 小时') + '</span></div>' +
      '<div class="stat"><span class="label">平均步数</span><span class="v">' + (avg(st) == null ? '—' : fmtN(avg(st))) + '</span></div>' +
      '</div><span class="muted tiny">星级达成率 = 已记录的天里拿到的星 ÷ 计分的星（' + starSum + ' / ' + starCnt + '）。分摊的消费按天平均，所以“花费”和“实际付款”可能不同。</span></section>';

    h += '<section class="card"><h2>每日花费（分摊后）</h2>' + spendChart(days, alloc) + '</section>';

    var catList = CATS.map(function (c) { return { c: c, v: cats[c.id] || 0 }; }).filter(function (x) { return x.v > 0.5; }).sort(function (a, b) { return b.v - a.v; });
    var maxC = catList.length ? catList[0].v : 1;
    h += '<section class="card"><h2>分类花费</h2>' + (catList.length ? '<div class="hbars">' + catList.map(function (x) {
      return '<span>' + x.c.name + '</span><span class="track"><i style="width:' + (x.v / maxC * 100).toFixed(1) + '%"></i></span><span class="v">' + fmtW(x.v) + '</span>';
    }).join('') + '</div>' : '<div class="empty">这段时间没有消费记录。</div>') + '</section>';

    return h + recordList(keys, alloc);
  }
  function recordList(keys, alloc) {
    return '<section class="card"><h2><span>所有记录</span><span class="hint">' + keys.length + ' 天</span></h2><div>' + (keys.length ? keys.map(function (k) {
      var ev = evaluate(k, alloc), dd = state.days[k];
      return '<div class="hrow"><div><b>' + fmtDate(k) + '</b><div class="stars" aria-label="' + ev.stars + ' 颗星">' + dimStars(ev) + '</div></div>' +
        '<div style="text-align:right"><span class="muted tiny">付款</span> <b class="num">' + fmtW(dayActual(k)) + '</b><div class="muted tiny">' + ev.stars + ' / ' + ev.counted + ' 颗星</div></div>' +
        (dd.diary.trim() ? '<div class="muted small wrapany" style="grid-column:1/-1">' + esc(dd.diary.slice(0, 60)) + (dd.diary.length > 60 ? '…' : '') + '</div>' : '') +
        '<div class="acts"><button type="button" class="linkbtn" data-act="go-record" data-date="' + k + '">修改记录</button><button type="button" class="linkbtn" data-act="go-settle" data-date="' + k + '">查看结算</button></div></div>';
    }).join('') : '<div class="empty">还没有任何记录。</div>') + '</div></section>';
  }

  function spendChart(days, alloc) {
    var W = Math.round(Math.max(256, Math.min(448, (window.innerWidth || 390) - 64)));
    var H = 160, padL = 46, padR = 6, padT = 10, padB = 24;
    var vals = days.map(function (k) { return alloc[k] ? alloc[k].total : 0; });
    var ref = isSetUp() ? finance(days[days.length - 1], alloc).base : null;
    if (ref != null && ref <= 0) ref = null;
    var max = Math.max.apply(null, vals.concat([ref || 0, 1]));
    var nice = niceMax(max);
    var iw = W - padL - padR, ih = H - padT - padB;
    var bw = iw / days.length, gap = Math.min(4, bw * 0.25);
    var y = function (v) { return padT + ih - v / nice * ih; };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="每日花费柱状图">';
    [0, 0.5, 1].forEach(function (f) {
      var v = nice * f, yy = y(v);
      svg += '<line class="gridline" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy + '" y2="' + yy + '"/>';
      svg += '<text x="' + (padL - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + shortW(v) + '</text>';
    });
    days.forEach(function (k, i) {
      var v = vals[i], x = padL + i * bw + gap / 2, w = Math.max(1, bw - gap), top = y(v), hgt = padT + ih - top;
      var over = ref != null && v > ref + 0.5;
      if (v > 0.5) {
        var r = Math.min(4, w / 2, hgt);
        svg += '<path class="barm' + (over ? ' over' : '') + (ui.chartSel === k ? ' sel' : '') + '" d="M' + x + ',' + (padT + ih) + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + top + ' ' + (x + w) + ',' + (top + r) + 'V' + (padT + ih) + 'Z"/>';
      }
      svg += '<rect class="hit" tabindex="0" role="button" aria-label="' + fmtDate(k) + ' ' + fmtW(v) + '" data-act="chart-sel" data-date="' + k + '" x="' + (padL + i * bw) + '" y="' + padT + '" width="' + bw + '" height="' + (ih + padB) + '"></rect>';
    });
    var maxLabels = Math.max(2, Math.floor(iw / 44));
    var step = Math.max(1, Math.ceil(days.length / maxLabels));
    days.forEach(function (k, i) {
      var last = i === days.length - 1;
      if ((i % step === 0 && (days.length - 1 - i >= step || last)) || last) {
        svg += '<text x="' + (padL + i * bw + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + fmtShort(k) + '</text>';
      }
    });
    if (ref != null) svg += '<line class="ref" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(ref) + '" y2="' + y(ref) + '"/>';
    svg += '</svg>';
    var sel = ui.chartSel && days.indexOf(ui.chartSel) >= 0 ? ui.chartSel : null;

  function addExpense() {

  function afterExport(msg) { markExported(); rerenderKeepScroll(); toast(msg); }

  function exportData() {
    if (demoMode) { toast('示例数据不需要备份'); return; }
    var json = backupJson(), name = 'leso-life-backup-' + todayKey() + '.json';
    // Outside claude.ai (own website / home-screen app): save with the browser itself.
    if (!IN_CLAUDE) { nativeSave(json, name); return; }
    getDownloads().then(function (dl) {
      if (!dl) { showJsonSheet(json, '这个页面现在不能直接下载文件。请复制下面的文本，粘贴到备忘录或发给自己保存。'); return; }
      return dl.save({ filename: name, data: json }).then(function () {
        afterExport('备份已保存');
      }, function (err) {
        var code = err && err.code;
        if (code === 'declined') toast('已取消保存');
        else if (code === 'rate_limited') toast('请稍等片刻再试');
        else showJsonSheet(json, '没能保存文件。请复制下面的文本，粘贴到备忘录或发给自己保存。');
      });
    });

  // iPhone/iPad: share sheet ("存储到文件"); Android and computers: a normal download. Copyable text is the last resort.
  var sharing = false;
  function nativeSave(json, name) {
    if (sharing) return;
    var textSheet = function (why) { showJsonSheet(json, why + '请复制下面的文本，粘贴到备忘录或发给自己保存。'); };
    if (IS_IOS && navigator.share && navigator.canShare) {
      // Some browsers refuse .json files in the share sheet but accept plain text.
      var file = null;
      [ 'application/json', 'text/plain' ].some(function (type) {
        try { var f = new File([json], name, { type: type }); if (navigator.canShare({ files: [f] })) { file = f; return true; } } catch (e) {}
        return false;
      });
      if (file) {
        sharing = true;
        navigator.share({ files: [file] }).then(function () { sharing = false; afterExport('备份已导出'); }, function (err) {
          sharing = false;
          if (err && err.name === 'AbortError') toast('已取消保存');
          else textSheet('没能打开分享。');
        });
        return;
      }
    }
    // A download inside a Home Screen app on iPhone opens a preview that can be hard to leave.
    if (IOS_APP) { textSheet('这里不能直接保存文件。'); return; }
    try {
      var url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      var a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      afterExport('备份文件已开始下载');
    } catch (e) {
      textSheet('这个浏览器不能直接下载文件。');
    }
  }

    openSheet('<h3>备份文本</h3><div class="small muted">' + esc(msg) + '</div><textarea id="jsonout" class="code" readonly style="min-height:200px">' + esc(json) + '</textarea>' +
      '<div class="btnrow"><button type="button" class="btn primary" data-act="copy-json">复制全部</button><button type="button" class="btn" data-act="mark-saved">我已保存好</button></div>' +
      '<button type="button" class="btn ghost" data-act="sheet-close">关闭</button>');
  }
  function copyJson() {
    if (demoMode) { toast('示例数据不需要备份'); return; }
    var json = backupJson();
    var done = function () { afterExport('备份文本已复制，记得粘贴保存到别处'); };
    var fallback = function () {
      if (!document.getElementById('jsonout')) showJsonSheet(json, '自动复制没有成功。请长按下面的文本，全选后复制，保存好后点“我已保存好”。');
      else toast('自动复制没有成功，请长按文本手动复制');
      var ta = document.getElementById('jsonout');
      if (ta) { ta.focus(); ta.select(); try { ta.setSelectionRange(0, ta.value.length); } catch (e) {} }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  var pendingImport = null;
  function tryImport(text) {
    var err = document.getElementById('import-err');
    var obj;
    function fail(m) { if (err) { err.textContent = m; err.hidden = false; } else toast(m); }
    try { obj = JSON.parse(text); } catch (e) { return fail('这不是有效的备份：无法读取 JSON 文本。'); }
    if (!obj || typeof obj !== 'object' || Array.isArray(obj) || obj.app !== APP_ID || !obj.settings || typeof obj.settings !== 'object') return fail('这不是 LESO LIFE 的备份文件。');
    pendingImport = normalize(obj);
    if (err) err.hidden = true;
    var n = Object.keys(pendingImport.days).length;
    confirmSheet('用备份覆盖现在的数据？', '备份里有 ' + n + ' 天记录。导入后，现在浏览器里的数据会被替换。如果不确定，可以先导出一份当前数据。', '导入并覆盖', 'import-confirm', true);
  }
  function resetUiForNewData() {
    ui.recDate = null; ui.setDate = null; ui.chartSel = null; balanceInputError = ''; dateInputNote = '';
    ['f-amt', 'f-note'].forEach(function (id) { var el = document.getElementById(id); if (el) el.value = ''; });
    var sp = document.getElementById('f-spread'); if (sp) sp.value = '1';
    resetDraft();
  }

  // ---------- event wiring ----------
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'sheet-scrim') { if (ev.target === t) closeSheet(); return; }
    var k = t.getAttribute('data-date');
    switch (act) {
      case 'tab': go(t.getAttribute('data-tab')); break;
      case 'go-record': {
        var an = t.getAttribute('data-anchor');
        go('record', { date: k, anchor: an, focus: an === 'sec-diary' ? 'f-diary' : (an === 'sec-expense' ? 'f-amt' : null) });
        break;
      }
      case 'go-settle': go('settle', { date: k }); break;
      case 'go-rules': go('settings', { anchor: 'sec-rules' }); break;
      case 'go-rules-money': go('settings', { anchor: 'sec-money', focus: 's-start' }); break;
      case 'day': {
        var which = t.getAttribute('data-which'), delta = +t.getAttribute('data-delta');
        var cur = which === 'rec' ? recDateShown() : (ui.setDate || todayKey());
        var nk = addDays(cur, delta); if (nk > todayKey()) nk = todayKey();
        if (which === 'rec') { syncDraftFromDom(); ui.recDate = nk; } else ui.setDate = nk;
        render(); break;
      }
      case 'day-today': if (t.getAttribute('data-which') === 'rec') { syncDraftFromDom(); ui.recDate = todayKey(); } else ui.setDate = todayKey(); render(); break;
      case 'draft-cat': {
        syncDraftFromDom();
        if (draft.date && draft.date !== recDateShown()) draft = blankDraft(recDateShown());
        draft.cat = isCat(t.getAttribute('data-cat')) ? t.getAttribute('data-cat') : 'meal'; draft.date = recDateShown();
        saveDraft(); rerenderKeepScroll(); break;
      }
      case 'add-expense': addExpense(); break;
      case 'edit-expense': editExpense(t.getAttribute('data-id')); break;
      case 'save-expense': saveExpense(k, t.getAttribute('data-id')); break;
      case 'del-expense': delExpense(t.getAttribute('data-id')); break;
      case 'body': {
        var dk = recDateShown(), d = ensureDay(dk), v = +t.getAttribute('data-v');
        d.body = d.body === v ? null : v; pruneDay(dk); saveNow(); syncDraftFromDom(); rerenderKeepScroll(); break;
      }
      case 'clear-day': confirmSheet('清空 ' + fmtDate(recDateShown()) + ' 的记录？', '这一天的日记、消费、饮食、睡眠、运动和身体记录都会被删除。', '清空这天', 'clear-day-confirm', true); break;
      case 'clear-day-confirm': {
        var ck = recDateShown(), old = state.days[ck];
        delete state.days[ck]; saveNow(); closeSheet(); render();
        toast('已清空这天的记录', function () { state.days[ck] = old; saveNow(); render(); });
        break;
      }
      case 'undo': if (undoFn) { var f = undoFn; undoFn = null; $toast.innerHTML = ''; f(); } break;
      case 'sheet-close': closeSheet(); break;
      case 'hist-range': ui.histRange = +t.getAttribute('data-v'); ui.chartSel = null; rerenderKeepScroll(); break;
      case 'chart-sel': ui.chartSel = ui.chartSel === k ? null : k; rerenderKeepScroll(); break;
      case 'a2hs-ok': lsSet(STORE_KEY + ':a2hs-ok', '1'); renderBanners(); break;
      case 'start-real':
        demoMode = false; state = freshState(); resetUiForNewData(); askPersist();
        saveNow(); go('settings', { focus: 's-balance' }); toast('已清空示例数据，先填写你的资金'); break;
      case 'show-corrupt':
        openSheet('<h3>无法读取的原始数据</h3><div class="small muted">这是之前保存但无法读取的内容。可以复制出来保存，再导入一份正确的备份。</div><textarea id="rawout" class="code" readonly style="min-height:200px">' + esc(corruptRaw || '') + '</textarea>' +
          '<div class="btnrow"><button type="button" class="btn primary" data-act="copy-raw">复制全部</button><button type="button" class="btn" data-act="sheet-close">关闭</button></div>');
        break;
      case 'copy-raw': {
        var rawTa = document.getElementById('rawout');
        var selRaw = function () { if (rawTa) { rawTa.focus(); rawTa.select(); try { rawTa.setSelectionRange(0, rawTa.value.length); } catch (e) {} } toast('请长按文本，全选后复制'); };
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(corruptRaw || '').then(function () { toast('原始文本已复制'); }, selRaw); else selRaw(); } catch (e) { selRaw(); }
        break;
      }
      case 'add-fixed': {
        var nm = document.getElementById('s-fx-name').value.trim().slice(0, 80), am = num(document.getElementById('s-fx-amt').value);
        var fe = document.getElementById('fx-err');
        if (am == null || am <= 0) { fe.textContent = '请输入大于 0 的金额。'; fe.hidden = false; return; }
        state.settings.fixedCosts.push({ id: uid(), name: nm || '固定支出', amount: Math.round(am) });
        saveNow(); rerenderKeepScroll(); toast('已添加固定支出'); break;
      }
      case 'del-fixed': {
        var id = t.getAttribute('data-id'), list = state.settings.fixedCosts, ix = -1;
        list.forEach(function (f, i) { if (f.id === id) ix = i; });
        if (ix >= 0) { var rm = list.splice(ix, 1)[0]; saveNow(); rerenderKeepScroll(); toast('已删除 ' + rm.name, function () { state.settings.fixedCosts.splice(ix, 0, rm); saveNow(); rerenderKeepScroll(); }); }
        break;
      }
      case 'rule-mode': state.settings.rules.budget.mode = t.getAttribute('data-v') === 'daily' ? 'daily' : 'pace'; saveNow(); rerenderKeepScroll(); break;
      case 'reset-rules': state.settings.rules = defaultRules(); saveNow(); rerenderKeepScroll(); toast('规则已恢复默认'); break;
      case 'export': exportData(); break;
      case 'copy-json': copyJson(); break;
      case 'mark-saved': if (!demoMode) { closeSheet(); afterExport('已记录这次备份'); } else closeSheet(); break;
      case 'import-text': tryImport(document.getElementById('importtext').value); break;
      case 'import-confirm':
        if (pendingImport) { state = pendingImport; pendingImport = null; demoMode = false; corruptRaw = null; resetUiForNewData(); saveNow(); closeSheet(); go('home'); toast('备份已导入'); }
        break;
      case 'clear-all': confirmSheet('清空所有数据？', '所有设置和记录都会被删除，无法撤销。建议先导出备份。', '清空', 'clear-confirm', true); break;
      case 'clear-confirm':
        var keepHour = state.settings.dayStartHour;
        state = freshState(todayKey()); state.settings.dayStartHour = keepHour; demoMode = false; resetUiForNewData(); saveNow(); closeSheet(); go('settings'); toast('已清空所有数据'); break;
    }
  });

  // The expense form belongs to the date on screen. A pending draft typed on another date is kept
  // until the user adds it, unless they start typing a new one here.
  function syncDraftFromDom() {
    var a = document.getElementById('f-amt'), n = document.getElementById('f-note'), sp = document.getElementById('f-spread');
    if (!a || !n || !sp) return;
    var k = recDateShown();
    var typed = !!(a.value || n.value.trim());
    if (draft.date && draft.date !== k && !typed) return;
    draft.amount = a.value; draft.note = n.value; draft.spread = +sp.value || 1; draft.date = k;
    if (!typed && SPREADS.indexOf(draft.spread) < 0) draft.spread = 1;
  }

  function onField(ev) {
    var el = ev.target;
    if (!el || !el.hasAttribute) return;
    // A half-typed number ("1e", "-") reads as empty; don't let it wipe the saved value.
    if (el.type === 'number' && el.validity && el.validity.badInput) return;
    // expense draft
    if (el.hasAttribute('data-draft')) { syncDraftFromDom(); saveDraft(); var er = document.getElementById('amt-err'); if (er) er.hidden = true; return; }
    // record fields: always write to the day that is on screen
    if (document.getElementById('rec-form') && (el.hasAttribute('data-field') || el.hasAttribute('data-meal') || el.hasAttribute('data-check'))) {
      var k = recDateShown(), d = ensureDay(k);
      if (el.hasAttribute('data-meal')) {
        var mid = el.getAttribute('data-meal'), m = d.meals[mid];
        var cb = document.getElementById('f-meal-' + mid);
        if (el.getAttribute('data-mk') === 'ate') { m.ate = el.checked; m.auto = false; }
        else {
          var had = !!m.text.trim();
          m.text = el.value.slice(0, 200);
          var has = !!m.text.trim();
          if (has && !had && !m.ate) { m.ate = true; m.auto = true; if (cb) cb.checked = true; }
          else if (!has && had && m.auto) { m.ate = false; m.auto = false; if (cb) cb.checked = false; }
        }
      } else if (el.hasAttribute('data-check')) {
        d.checks[el.getAttribute('data-check')] = el.checked;
      } else {
        var f = el.getAttribute('data-field');
        if (f === 'diary') d.diary = el.value.slice(0, 20000);
        else if (f === 'bodyNote') d.bodyNote = el.value.slice(0, 200);
        else if (f === 'bodySkip') d.bodySkip = el.checked;
        else {
          var raw = num(el.value), v = raw;
          if (v != null) {
            v = Math.max(0, v);
            if (f === 'sleep') v = Math.min(24, v);
            else v = Math.round(v);
          }
          d[f] = v;
          var note = document.getElementById('health-note');
          if (raw != null && v !== raw) {
            if (note) { note.textContent = (f === 'sleep' ? '睡眠' : f === 'steps' ? '步数' : '运动分钟') + '已按 ' + fmtN(v, 1) + ' 记录。'; note.hidden = false; }
            if (ev.type === 'change') el.value = v;
          } else if (note && ev.type === 'change') note.hidden = true;
        }
      }
      pruneDay(k);
      saveSoon();
      return;
    }
    // settings
    if (el.hasAttribute('data-set')) {
      var key = el.getAttribute('data-set'), s = state.settings;
      if (key === 'startDate' || key === 'endDate') {
        // iOS fires both input and change for the same pick; only react to a real change.
        if (isKey(el.value) && el.value !== s[key]) {
          dateInputNote = '';
          if (key === 'startDate') {
            var len = Math.max(0, diffDays(s.endDate, s.startDate));
            s.startDate = el.value;
            if (s.endDate < s.startDate) { s.endDate = addDays(s.startDate, len); dateInputNote = '开始日期晚于原来的结束日期，结束日期已一起顺延到 ' + fmtDate(s.endDate) + '。'; }
          } else if (el.value < s.startDate) {
            dateInputNote = '“需要撑到哪一天”不能早于开始日期，这个日期没有保存。';
            if (ev.type === 'change') el.value = s.endDate;
          } else s.endDate = el.value;
        }
      }
      else if (key === 'goalText') s.goalText = el.value.slice(0, 500);
      else if (key === 'dayStartHour') s.dayStartHour = Math.min(6, Math.max(0, +el.value || 0));
      else {
        var nv = num(el.value);
        if (key === 'balance') {
          balanceInputError = '';
          if (nv != null && nv < 0) balanceInputError = '资金不能是负数，这个数字没有保存。';
          else s.balance = nv == null ? null : Math.round(nv);
        } else if (key === 'reserve') {
          s.reserve = Math.max(0, Math.round(nv || 0));
          if (nv != null && nv < 0 && ev.type === 'change') el.value = 0;
        } else if (key === 'foodDaily') {
          var fe = document.getElementById('food-err');
          if (nv != null && nv < 0) {
            if (fe) { fe.textContent = '饮食预算不能是负数，这个数字没有保存。'; fe.hidden = false; }
            if (ev.type === 'change') el.value = s.foodDaily == null ? '' : s.foodDaily;
            return;
          }
          if (fe) fe.hidden = true;
          s.foodDaily = nv != null && nv > 0 ? Math.round(nv) : null;
          var fb = document.getElementById('r-foodbudget'), fw = document.getElementById('r-foodbudget-wrap'), fh = document.getElementById('r-foodbudget-hint');
          if (fb) fb.disabled = s.foodDaily == null; if (fw) fw.classList.toggle('disabled', s.foodDaily == null); if (fh) fh.hidden = s.foodDaily != null;
        }
      }
      saveSoon();
      var errEl = document.getElementById('set-err'), msg = settingsErrors();
      if (errEl) { errEl.textContent = msg; errEl.hidden = !msg; }
      var cc = document.getElementById('calc-card'); if (cc) cc.innerHTML = calcCard();
      if ((key === 'dayStartHour' || key === 'startDate' || key === 'endDate') && ev.type === 'change') rerenderKeepScroll();
      return;
    }
    if (el.hasAttribute('data-rule')) {
      var path = el.getAttribute('data-rule'), pp = path.split('.'), R = state.settings.rules[pp[0]];
      var rn = document.getElementById('rule-note');
      if (el.type === 'checkbox') R[pp[1]] = el.checked;
      else {
        var rv = clampRule(path, el.value);
        if (rv == null) { if (ev.type === 'change') el.value = R[pp[1]]; return; }
        R[pp[1]] = rv;
        var typedN = num(el.value), spec = RULE_SPEC[path];
        if (rv !== typedN) {
          if (rn) { rn.textContent = (typedN < spec.min || typedN > spec.max ? '超出范围（' + spec.min + '–' + spec.max + '），' : spec.int ? '这一项只能填整数，' : '这一项按半小时计算，') + '已按 ' + rv + ' 保存。'; rn.hidden = false; }
          if (ev.type === 'change') el.value = rv;
        } else if (rn && ev.type === 'change') rn.hidden = true;
      }
      var se = document.getElementById('sleep-err');
      if (se) se.hidden = !(state.settings.rules.sleep.minHours > state.settings.rules.sleep.maxHours);
      saveSoon();
    }
  }
  document.addEventListener('input', onField);
  document.addEventListener('change', function (ev) {
    if (ev.target.id === 'importfile') {
      var file = ev.target.files && ev.target.files[0]; if (!file) return;
      if (file.size > 20 * 1024 * 1024) { var e0 = document.getElementById('import-err'); e0.textContent = '文件太大，不像是 LESO LIFE 的备份。'; e0.hidden = false; ev.target.value = ''; return; }
      var rd = new FileReader();
      rd.onload = function () { tryImport(String(rd.result || '')); ev.target.value = ''; };
      rd.onerror = function () { var e = document.getElementById('import-err'); e.textContent = '读取文件失败，请重试。'; e.hidden = false; };
      rd.readAsText(file);
      return;
    }
    onField(ev);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && $sheet.innerHTML) { closeSheet(); return; }
    if (ev.key === 'Enter' && (ev.target.id === 'f-amt' || ev.target.id === 'f-note')) { ev.preventDefault(); addExpense(); return; }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('data-act') === 'chart-sel') { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });

  // ---------- boot ----------
  storageOK = probeStore();
  var raw = lsGet(STORE_KEY);
  var parsed = null;
  if (raw != null) {
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    if (!parsed || typeof parsed !== 'object' || parsed.app !== APP_ID) {
      corruptRaw = raw;
      if (lsGet(STORE_KEY + ':unreadable') !== raw) lsSet(STORE_KEY + ':unreadable', raw);
      parsed = null;
    }
  }
  if (parsed) { state = normalize(parsed); demoMode = false; loadDraft(); askPersist(); }
  else { state = makeDemo(); demoMode = true; }
  setInterval(checkRollover, 60000);
  render();
})();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
